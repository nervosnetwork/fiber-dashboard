name: Build backend image

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-backend
  LATEST_BRANCH: master

jobs:
  docker:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            raw_branch="${GITHUB_HEAD_REF}"
          else
            raw_branch="${GITHUB_REF_NAME}"
          fi

          branch_tag="$(
            printf '%s' "${raw_branch}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E \
                  -e 's#[/_]+#-#g' \
                  -e 's#[^a-z0-9.-]+#-#g' \
                  -e 's#-+#-#g' \
                  -e 's#^[-.]+##' \
                  -e 's#[-.]+$##'
          )"

          if [[ -z "${branch_tag}" ]]; then
            branch_tag="branch"
          fi

          short_sha="${GITHUB_SHA::7}"

          tags="${IMAGE_NAME}:${branch_tag}-${short_sha}"
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" && "${raw_branch}" == "${LATEST_BRANCH}" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:latest"
          fi

          {
            echo "branch_tag=${branch_tag}"
            echo "short_sha=${short_sha}"
            echo "push_image=$([[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] && echo false || echo true)"
            echo "tags<<EOF"
            printf '%s\n' "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        if: steps.meta.outputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.push_image == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

